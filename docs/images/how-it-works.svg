<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" rx="10" fill="#1b1f29"/>

  <!-- LEFT: what you draw -->
  <text x="150" y="38" fill="#d7e2f2" font-size="18" font-weight="700" text-anchor="middle">1. You draw</text>

  <!-- building rectangle -->
  <rect x="55" y="70" width="190" height="150" fill="none" stroke="#9aa7bd" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- door line (red) on bottom edge -->
  <line x1="120" y1="220" x2="180" y2="220" stroke="#ff4040" stroke-width="7" stroke-linecap="round"/>
  <!-- window line (blue) on right edge -->
  <line x1="245" y1="110" x2="245" y2="160" stroke="#4080ff" stroke-width="7" stroke-linecap="round"/>

  <text x="150" y="250" fill="#9aa7bd" font-size="13" text-anchor="middle">rectangle = building</text>
  <text x="150" y="268" fill="#ff6a6a" font-size="13" text-anchor="middle">red line = door</text>
  <text x="150" y="286" fill="#6a9cff" font-size="13" text-anchor="middle">blue line = window</text>

  <!-- ARROW -->
  <text x="380" y="150" fill="#9fe0ad" font-size="40" text-anchor="middle">&#8594;</text>
  <text x="380" y="180" fill="#9fe0ad" font-size="14" text-anchor="middle" font-weight="700">Build</text>

  <!-- RIGHT: what you get -->
  <text x="610" y="38" fill="#d7e2f2" font-size="18" font-weight="700" text-anchor="middle">2. You get walls</text>

  <!-- solid walls with a door gap (bottom) and window (right) -->
  <!-- top -->
  <line x1="515" y1="70" x2="705" y2="70" stroke="#e8eefb" stroke-width="4"/>
  <!-- left -->
  <line x1="515" y1="70" x2="515" y2="220" stroke="#e8eefb" stroke-width="4"/>
  <!-- bottom with door gap (120..180 region mapped) -->
  <line x1="515" y1="220" x2="580" y2="220" stroke="#e8eefb" stroke-width="4"/>
  <line x1="640" y1="220" x2="705" y2="220" stroke="#e8eefb" stroke-width="4"/>
  <!-- door marker arc -->
  <path d="M580 220 A60 60 0 0 1 640 220" fill="none" stroke="#ffb347" stroke-width="3"/>
  <line x1="580" y1="220" x2="580" y2="185" stroke="#ffb347" stroke-width="3"/>
  <!-- right wall with window (segment shown lighter/dashed = see-through) -->
  <line x1="705" y1="70" x2="705" y2="110" stroke="#e8eefb" stroke-width="4"/>
  <line x1="705" y1="160" x2="705" y2="220" stroke="#e8eefb" stroke-width="4"/>
  <line x1="705" y1="110" x2="705" y2="160" stroke="#6a9cff" stroke-width="4" stroke-dasharray="3 4"/>

  <text x="610" y="250" fill="#9aa7bd" font-size="13" text-anchor="middle">4 solid walls</text>
  <text x="610" y="268" fill="#ffb347" font-size="13" text-anchor="middle">working door (opens)</text>
  <text x="610" y="286" fill="#6a9cff" font-size="13" text-anchor="middle">see-through window</text>
</svg>
